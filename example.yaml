substitutions:
  device_name: spa-controller

esphome:
  name: ${device_name}
  friendly_name: Spa Controller

esp32:
  # Seeed Studio XIAO ESP32-C3 - the generic C3 definition works for it
  board: esp32-c3-devkitm-1
  framework:
    type: arduino  # esp-idf works too - see the README's Configuration Reference

# Import Gecko Spa component from GitHub
external_components:
  - source: github://zteifel/esphome-gecko
    components: [gecko_spa]

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

# Gecko Spa component - direct connection to the spa I2C bus through a
# bidirectional logic level converter. XIAO D0/D2; see the README's Hardware
# Build section for why these and not the labelled SDA/SCL (D4/D5).
gecko_spa:
  id: spa
  sda: GPIO2
  scl: GPIO4

# Climate control
climate:
  - platform: gecko_spa
    gecko_spa_id: spa
    name: "Spa"

# Switches
switch:
  - platform: gecko_spa
    gecko_spa_id: spa
    type: light
    name: "Spa Light"
    icon: "mdi:lightbulb"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: pump1
    name: "Spa Pump"
    icon: "mdi:pump"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: circulation
    name: "Spa Circulation"
    icon: "mdi:rotate-3d-variant"

# Program selector
select:
  - platform: gecko_spa
    gecko_spa_id: spa
    name: "Spa Program"
    icon: "mdi:format-list-bulleted"

# Status sensors
binary_sensor:
  - platform: gecko_spa
    gecko_spa_id: spa
    type: standby
    name: "Spa Standby"
    icon: "mdi:power-standby"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: connected
    name: "Spa Connected"
    icon: "mdi:connection"
    device_class: connectivity

# Optional: buttons to refresh status and to kick the bus if it ever wedges
button:
  - platform: template
    name: "Refresh Spa Status"
    icon: "mdi:refresh"
    on_press:
      - lambda: |-
          id(spa).request_status();

  - platform: template
    name: "Reconnect Spa Bus"
    icon: "mdi:restart"
    on_press:
      - lambda: |-
          id(spa).recover_link();
