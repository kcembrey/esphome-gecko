# Reference build: Seeed Studio XIAO ESP32-C3 wired straight to the spa's I2C
# bus through a BSS138 logic level converter. No Arduino in the middle.
#
#   XIAO pin   GPIO    Goes to
#   D0         GPIO2   converter LV1 -> spa SDA
#   D2         GPIO4   converter LV2 -> spa SCL
#   3V3                converter LV   (must be 3.3V, never 5V)
#   GND                converter GND
#
# A 220 ohm resistor in series with each I2C line, at the XIAO end, is cheap
# insurance for the pins - see "Protecting the ESP32 pins" in the README.
#
# On a healthy board, D4/D5 (GPIO6/GPIO7, the XIAO's labelled SDA/SCL) are the
# better choice because they are not strapping pins. This build moved to D0/D2
# after GPIO6/GPIO7 on the original board were damaged by 5V from the old
# Arduino proxy wiring.

substitutions:
  device_name: spa-controller

esphome:
  name: ${device_name}
  friendly_name: Spa Controller

esp32:
  # The generic C3 board definition works for the XIAO ESP32-C3.
  board: esp32-c3-devkitm-1
  framework:
    # Direct I2C works on arduino or esp-idf (ESP-IDF 5.4+). This build has
    # been run against a spa on arduino.
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Spa Controller Fallback"
    password: !secret ap_password

captive_portal:

# Time synced from Home Assistant for accurate date calculations
time:
  - platform: homeassistant
    id: ha_time
    timezone: America/Mexico_City  # Set to yours

# Import Gecko Spa component
external_components:
  - source:
      type: local
      path: ../components

# Gecko Spa component - direct connection to the spa I2C bus.
# GPIO2 is a strapping pin on the C3, so ESPHome warns about it. The I2C
# pull-ups hold it high at reset, which is the state it needs.
gecko_spa:
  id: spa
  sda: GPIO2  # XIAO D0
  scl: GPIO4  # XIAO D2
  notif_date_format: Y-M-D  # Change to D-M-Y if dates for reminders don't look right

# Climate control
climate:
  - platform: gecko_spa
    gecko_spa_id: spa
    name: "Spa"

switch:
  - platform: gecko_spa
    gecko_spa_id: spa
    type: light
    name: "Spa Light"
    icon: "mdi:lightbulb"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: circulation
    name: "Spa Circulation"
    icon: "mdi:rotate-3d-variant"

  # Pumps 1-4 (controllable - P2-P4 use experimental function IDs)
  - platform: gecko_spa
    gecko_spa_id: spa
    type: pump1
    name: "Spa Pump 1"
    icon: "mdi:pump"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: pump2
    name: "Spa Pump 2"
    icon: "mdi:pump"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: pump3
    name: "Spa Pump 3"
    icon: "mdi:pump"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: pump4
    name: "Spa Pump 4"
    icon: "mdi:pump"

# Program selector
select:
  - platform: gecko_spa
    gecko_spa_id: spa
    name: "Spa Program"
    icon: "mdi:format-list-bulleted"

# Status sensors
binary_sensor:
  - platform: gecko_spa
    gecko_spa_id: spa
    type: standby
    name: "Spa Standby"
    icon: "mdi:power-standby"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: connected
    name: "Spa Connected"
    icon: "mdi:connection"
    device_class: connectivity

  # Read-only status sensors (no control commands available)
  - platform: gecko_spa
    gecko_spa_id: spa
    type: waterfall
    name: "Spa Waterfall"
    icon: "mdi:waterfall"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: blower
    name: "Spa Blower"
    icon: "mdi:fan"

# Spa internal clock and notification due dates
text_sensor:
  - platform: gecko_spa
    gecko_spa_id: spa
    type: spa_time
    name: "Spa Time"
    icon: "mdi:clock-outline"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: rinse_filter
    id: spa_rinse_filter
    name: "Spa Rinse Filter Due"
    icon: "mdi:air-filter"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: clean_filter
    id: spa_clean_filter
    name: "Spa Clean Filter Due"
    icon: "mdi:vacuum"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: change_water
    id: spa_change_water
    name: "Spa Change Water Due"
    icon: "mdi:water-sync"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: spa_checkup
    id: spa_checkup
    name: "Spa Checkup Due"
    icon: "mdi:wrench-clock"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: config_version
    name: "Spa Config Version"
    icon: "mdi:file-cog"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: status_version
    name: "Spa Status Version"
    icon: "mdi:file-document"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: lock_mode
    name: "Spa Lock Mode"
    icon: "mdi:lock"

  - platform: gecko_spa
    gecko_spa_id: spa
    type: pack_type
    name: "Spa Pack Type"
    icon: "mdi:package-variant"

# Days remaining sensors (calculated from due dates using HA time)
sensor:
  - platform: gecko_spa
    gecko_spa_id: spa
    type: pump_timer
    name: "Spa Pump Timer"

  - platform: template
    name: "Spa Rinse Filter Days"
    id: rinse_filter_days
    unit_of_measurement: "days"
    icon: "mdi:air-filter"
    lambda: |-
      auto due = id(spa_rinse_filter).state;
      if (due.empty()) return NAN;
      int y, m, d;
      if (sscanf(due.c_str(), "%d-%d-%d", &y, &m, &d) != 3) return NAN;
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      // Calculate days difference
      int due_days = y*365 + m*30 + d;
      int now_days = now.year*365 + now.month*30 + now.day_of_month;
      return (float)(due_days - now_days);

  - platform: template
    name: "Spa Clean Filter Days"
    id: clean_filter_days
    unit_of_measurement: "days"
    icon: "mdi:vacuum"
    lambda: |-
      auto due = id(spa_clean_filter).state;
      if (due.empty()) return NAN;
      int y, m, d;
      if (sscanf(due.c_str(), "%d-%d-%d", &y, &m, &d) != 3) return NAN;
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      int due_days = y*365 + m*30 + d;
      int now_days = now.year*365 + now.month*30 + now.day_of_month;
      return (float)(due_days - now_days);

  - platform: template
    name: "Spa Change Water Days"
    id: change_water_days
    unit_of_measurement: "days"
    icon: "mdi:water-sync"
    lambda: |-
      auto due = id(spa_change_water).state;
      if (due.empty()) return NAN;
      int y, m, d;
      if (sscanf(due.c_str(), "%d-%d-%d", &y, &m, &d) != 3) return NAN;
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      int due_days = y*365 + m*30 + d;
      int now_days = now.year*365 + now.month*30 + now.day_of_month;
      return (float)(due_days - now_days);

  - platform: template
    name: "Spa Checkup Days"
    id: spa_checkup_days
    unit_of_measurement: "days"
    icon: "mdi:wrench-clock"
    lambda: |-
      auto due = id(spa_checkup).state;
      if (due.empty()) return NAN;
      int y, m, d;
      if (sscanf(due.c_str(), "%d-%d-%d", &y, &m, &d) != 3) return NAN;
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      int due_days = y*365 + m*30 + d;
      int now_days = now.year*365 + now.month*30 + now.day_of_month;
      return (float)(due_days - now_days);

  - platform: wifi_signal
    name: "Spa WiFi Signal"
    update_interval: 60s

# Buttons
button:
  - platform: template
    name: "Refresh Spa Status"
    icon: "mdi:refresh"
    on_press:
      - lambda: |-
          id(spa).request_status();

  - platform: template
    name: "Reconnect Spa Bus"
    icon: "mdi:restart"
    on_press:
      - lambda: |-
          id(spa).recover_link();
